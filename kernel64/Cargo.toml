[package]
name = "kernel64"
version = "0.1.0"
edition = "2021"
description = "The 64-bit TheTaaJ kernel"
publish = false

[[bin]]
name = "kernel64"
path = "src/main.rs"
# A kernel has no test harness to run its tests in (yet), and `cargo
# test` would try to build one against `std`.
test = false
bench = false

[dependencies]
# Only our own: the system call interface, shared with user programs.
# Every line of the kernel is ours to read.
abi = { path = "../abi" }
# The allocator, shared with user programs.
heap = { path = "../../heap" }
# What the AArch64 kernel does not use yet (see the note at the top of
# main.rs): these move up beside `abi` as the port reaches them.
[target.'cfg(target_arch = "aarch64")'.dependencies]
# virtio-mmio's identifying registers: whether one of the places the
# device tree describes holds a device at all (mmio_devices.rs) - the
# bus's own protocol, as PCI's scan is. Which kinds of device there are
# is the drivers' business: on a PC the kernel needs none of this (K75).
virtio = { path = "../../virtio" }

[target.'cfg(target_arch = "x86_64")'.dependencies]
# The font - for the kernel's last words, on the screen (lastwords.rs).
console = { path = "../../console" }

[features]
# Deliberately fault after booting, to check that each protection holds
# and each handler reports it correctly. Never in a normal build; `make
# fault64-test` builds and boots each in turn.
fault-tests = []                    # (internal: the shared test code)
fault-page = ["fault-tests"]        # read unmapped memory
fault-double = ["fault-tests"]      # an exception with no usable stack
fault-rodata = ["fault-tests"]      # write to read-only data
fault-nx = ["fault-tests"]          # execute data
fault-stack = ["fault-tests"]       # overflow the boot stack
fault-thread-stack = ["fault-tests"] # overflow a kernel thread's stack
fault-init = ["fault-tests"]         # init is a program that ends
fault-null = ["fault-tests"]         # read through a null pointer (AArch64 so far)
fault-panic = ["fault-tests"]        # panic, reset, and find the crash record (K188)

# A kernel made deliberately large, so that it ends well above 2 MiB:
# checks that the bootloaders load all of a big kernel, and correctly.
# Never in a normal build; `make big64-test` builds and boots it.
big-image = []

# No unwinding: there is nothing to unwind into. A panic prints and halts.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
debug = true    # keep symbols - addresses in a fault mean nothing without them
